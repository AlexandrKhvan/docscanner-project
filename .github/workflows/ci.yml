name: CI
on:
  push: { branches: [ main ] }
  pull_request: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install deps
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f requirements-dev ]; then pip install -r requirements-dev; fi

      - name: Make repo importable (PYTHONPATH)
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Disable heavy DL (optional)
        run: echo "DOCSCAN_DISABLE_HED=1" >> $GITHUB_ENV

      - name: Run tests
        run: python -m pytest --maxfail=1 --durations=10 --cov=docscan --cov-report=term-missing

      - name: Test editor
        run: node --test tests/editor-geometry.test.cjs tests/editor-session.test.cjs
